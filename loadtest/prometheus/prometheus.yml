global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: goodqueue-backend
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  - job_name: goodqueue-loadtest-runner
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["loadtest-runner:8081"]
