services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: "${GOODQUEUE_POSTGRES_DB:-goodqueue}"
      POSTGRES_USER: "${GOODQUEUE_POSTGRES_USER:-goodqueue}"
      POSTGRES_PASSWORD: "${GOODQUEUE_POSTGRES_PASSWORD:?GOODQUEUE_POSTGRES_PASSWORD must be set}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${GOODQUEUE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - goodqueue-postgres:/var/lib/postgresql

  migrate:
    build: .
    image: "${COMPOSE_PROJECT_NAME:-goodqueue}-app"
    entrypoint: ["goose"]
    command: ["-dir", "/app/migrations", "postgres", "postgres://${GOODQUEUE_POSTGRES_USER:-goodqueue}:${GOODQUEUE_POSTGRES_PASSWORD:?GOODQUEUE_POSTGRES_PASSWORD must be set}@postgres:5432/${GOODQUEUE_POSTGRES_DB:-goodqueue}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    image: "${COMPOSE_PROJECT_NAME:-goodqueue}-app"
    environment:
      GIN_MODE: release
      GOODQUEUE_HTTP_ADDRESS: :8080
      GOODQUEUE_HTTP_READ_HEADER_TIMEOUT: 5s
      GOODQUEUE_CORS_ALLOWED_ORIGINS: "${GOODQUEUE_CORS_ALLOWED_ORIGINS:-https://goodqueue.ivanzubkov.ru,http://localhost:5173,http://127.0.0.1:5173}"
      GOODQUEUE_DATABASE_URL: "postgres://${GOODQUEUE_POSTGRES_USER:-goodqueue}:${GOODQUEUE_POSTGRES_PASSWORD:?GOODQUEUE_POSTGRES_PASSWORD must be set}@postgres:5432/${GOODQUEUE_POSTGRES_DB:-goodqueue}?sslmode=disable"
      GOODQUEUE_UNSAFE_STOCK_ADJUSTMENT: "${GOODQUEUE_UNSAFE_STOCK_ADJUSTMENT:-false}"
      GOODQUEUE_UNSAFE_PAYMENT_CALLBACK: "${GOODQUEUE_UNSAFE_PAYMENT_CALLBACK:-false}"
      GOODQUEUE_RECOMMENDATIONS_AI_ENABLED: "${GOODQUEUE_RECOMMENDATIONS_AI_ENABLED:-false}"
      GOODQUEUE_OPENAI_API_KEY: "${GOODQUEUE_OPENAI_API_KEY:-}"
      GOODQUEUE_OPENAI_BASE_URL: "${GOODQUEUE_OPENAI_BASE_URL:-https://api.openai.com/v1}"
      GOODQUEUE_OPENAI_EMBEDDING_MODEL: "${GOODQUEUE_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
      GOODQUEUE_OPENAI_EMBEDDING_TIMEOUT: "${GOODQUEUE_OPENAI_EMBEDDING_TIMEOUT:-8s}"
      GOODQUEUE_CHECKOUT_TTL: "${GOODQUEUE_CHECKOUT_TTL:-5m}"
      GOODQUEUE_WAITING_BUFFER_PERCENT: "${GOODQUEUE_WAITING_BUFFER_PERCENT:-100}"
      GOODQUEUE_ADAPTIVE_QUEUE_ENABLED: "${GOODQUEUE_ADAPTIVE_QUEUE_ENABLED:-false}"
      GOODQUEUE_ADAPTIVE_QUEUE_INTERVAL: "${GOODQUEUE_ADAPTIVE_QUEUE_INTERVAL:-1m}"
      GOODQUEUE_ADAPTIVE_QUEUE_MIN_HTTP_REQUESTS: "${GOODQUEUE_ADAPTIVE_QUEUE_MIN_HTTP_REQUESTS:-100}"
      GOODQUEUE_ADAPTIVE_QUEUE_MIN_CHECKOUT_OUTCOMES: "${GOODQUEUE_ADAPTIVE_QUEUE_MIN_CHECKOUT_OUTCOMES:-20}"
      GOODQUEUE_ADAPTIVE_QUEUE_MIN_HTTP_SUCCESS_PERCENT: "${GOODQUEUE_ADAPTIVE_QUEUE_MIN_HTTP_SUCCESS_PERCENT:-95}"
      GOODQUEUE_ADAPTIVE_QUEUE_MIN_BUFFER_PERCENT: "${GOODQUEUE_ADAPTIVE_QUEUE_MIN_BUFFER_PERCENT:-0}"
      GOODQUEUE_ADAPTIVE_QUEUE_MAX_BUFFER_PERCENT: "${GOODQUEUE_ADAPTIVE_QUEUE_MAX_BUFFER_PERCENT:-500}"
      GOODQUEUE_ADAPTIVE_QUEUE_MAX_STEP_PERCENT: "${GOODQUEUE_ADAPTIVE_QUEUE_MAX_STEP_PERCENT:-25}"
      GOODQUEUE_WORKER_INTERVAL: "${GOODQUEUE_WORKER_INTERVAL:-1s}"
      GOODQUEUE_LOADTEST_PROMETHEUS_URL: http://prometheus:9090
      GOODQUEUE_LOADTEST_SUCCESS_RATE_WINDOW: "${GOODQUEUE_LOADTEST_SUCCESS_RATE_WINDOW:-30m}"
    ports:
      - "127.0.0.1:${GOODQUEUE_HTTP_PORT:-2001}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-https://api.goodqueue.ivanzubkov.ru}"
    image: "${COMPOSE_PROJECT_NAME:-goodqueue}-frontend"
    ports:
      - "127.0.0.1:${GOODQUEUE_FRONTEND_PORT:-2000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

  dozzle:
    image: amir20/dozzle:v10.6.12
    environment:
      DOZZLE_HOSTNAME: GoodQueue
      DOZZLE_FILTER: "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME:-goodqueue}"
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
    ports:
      - "127.0.0.1:${GOODQUEUE_DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - goodqueue-dozzle:/data
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  goodqueue-postgres:
  goodqueue-dozzle:
