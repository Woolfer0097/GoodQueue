services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: goodqueue
      POSTGRES_USER: goodqueue
      POSTGRES_PASSWORD: goodqueue
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodqueue -d goodqueue"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${GOODQUEUE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - goodqueue-postgres:/var/lib/postgresql

  migrate:
    build: .
    image: "${COMPOSE_PROJECT_NAME:-goodqueue}-app"
    entrypoint: ["goose"]
    command: ["-dir", "/app/migrations", "postgres", "postgres://goodqueue:goodqueue@postgres:5432/goodqueue?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    image: "${COMPOSE_PROJECT_NAME:-goodqueue}-app"
    environment:
      GIN_MODE: release
      GOODQUEUE_HTTP_ADDRESS: :8080
      GOODQUEUE_HTTP_READ_HEADER_TIMEOUT: 5s
      GOODQUEUE_CORS_ALLOWED_ORIGINS: "${GOODQUEUE_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      GOODQUEUE_DATABASE_URL: postgres://goodqueue:goodqueue@postgres:5432/goodqueue?sslmode=disable
      GOODQUEUE_UNSAFE_PAYMENT_CALLBACK: "${GOODQUEUE_UNSAFE_PAYMENT_CALLBACK:-false}"
      GOODQUEUE_CHECKOUT_TTL: "${GOODQUEUE_CHECKOUT_TTL:-5m}"
      GOODQUEUE_WORKER_INTERVAL: "${GOODQUEUE_WORKER_INTERVAL:-1s}"
      GOODQUEUE_LOADTEST_PROMETHEUS_URL: http://prometheus:9090
      GOODQUEUE_LOADTEST_SUCCESS_RATE_WINDOW: "${GOODQUEUE_LOADTEST_SUCCESS_RATE_WINDOW:-30m}"
    ports:
      - "127.0.0.1:${GOODQUEUE_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  dozzle:
    image: amir20/dozzle:v10.6.12
    environment:
      DOZZLE_HOSTNAME: GoodQueue
      DOZZLE_FILTER: "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME:-goodqueue}"
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
    ports:
      - "127.0.0.1:${GOODQUEUE_DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - goodqueue-dozzle:/data
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  goodqueue-postgres:
  goodqueue-dozzle:
