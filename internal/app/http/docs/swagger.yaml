basePath: /
consumes:
- application/json
definitions:
  handler.CheckoutAuthorizationResponse:
    properties:
      authorization_id:
        format: uuid
        type: string
      authorized:
        example: true
        type: boolean
      authorized_at:
        format: date-time
        type: string
      entry_id:
        example: 42
        type: integer
      product_id:
        format: uuid
        type: string
      status:
        example: purchased
        type: string
    required:
    - authorization_id
    - authorized
    - authorized_at
    - entry_id
    - product_id
    - status
    type: object
  handler.ErrorResponse:
    properties:
      code:
        example: PRODUCT_NOT_FOUND
        type: string
      message:
        example: Товар не найден
        type: string
      request_id:
        example: 7ae799c1-0dfa-4248-b80b-4e60e61f431d
        type: string
    required:
    - code
    - message
    - request_id
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    required:
    - status
    type: object
  handler.ProductResponse:
    properties:
      available:
        example: 1
        type: integer
      description:
        example: Описание товара
        type: string
      id:
        example: 280f1230-81e3-4e10-aad6-864d8bb12a78
        format: uuid
        type: string
      image_url:
        example: https://example.com/product.jpg
        format: uri
        type: string
      price:
        example: 1999900
        type: integer
      queue_enabled:
        example: true
        type: boolean
      right_ttl_seconds:
        example: 120
        type: integer
      title:
        example: Лимитированная игровая приставка
        type: string
    required:
    - available
    - description
    - id
    - image_url
    - price
    - queue_enabled
    - right_ttl_seconds
    - title
    type: object
  handler.QueueEntryResponse:
    properties:
      entry_id:
        example: 42
        type: integer
      expires_at:
        format: date-time
        type: string
        x-nullable: true
      position:
        example: 3
        type: integer
        x-nullable: true
      product_id:
        format: uuid
        type: string
      status:
        enum:
        - waiting
        - granted
        - purchased
        - cancelled
        - expired
        example: waiting
        type: string
      total_waiting:
        example: 7
        type: integer
        x-nullable: true
    required:
    - entry_id
    - expires_at
    - position
    - product_id
    - status
    - total_waiting
    type: object
  middleware.ErrorBody:
    properties:
      code:
        example: not_implemented
        type: string
      message:
        example: not implemented
        type: string
    required:
    - code
    - message
    type: object
  middleware.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/middleware.ErrorBody'
    required:
    - error
    type: object
info:
  contact: {}
  description: Backend skeleton for a fair purchase queue. Business operations currently
    return a deterministic 501 response.
  title: GoodQueue API
  version: 0.1.0
paths:
  /api/v1/products:
    get:
      description: Returns the mock product catalog when mock API mode is enabled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.ProductResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: List products
      tags:
      - products
  /api/v1/products/{productID}:
    get:
      description: Returns a product from PostgreSQL by UUID.
      parameters:
      - description: Trusted external user identity supplied by upstream authentication
        in: header
        maxLength: 255
        name: X-User-ID
        type: string
      - description: Product UUID
        format: uuid
        in: path
        name: productID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ProductResponse'
        "400":
          description: INVALID_PRODUCT_ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get a product
      tags:
      - products
  /api/v1/products/{productID}/checkout-authorizations:
    post:
      consumes:
      - application/json
      description: Returns a stable successful authorization in mock API mode; no
        purchase right or stock is changed.
      parameters:
      - description: External user identity
        in: header
        maxLength: 255
        name: X-User-ID
        required: true
        type: string
      - description: Product UUID
        format: uuid
        in: path
        name: productID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CheckoutAuthorizationResponse'
        "400":
          description: INVALID_PRODUCT_ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: UNAUTHORIZED or INVALID_USER_ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "501":
          description: Mock API disabled
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Authorize checkout
      tags:
      - checkout
  /api/v1/products/{productID}/queue-entries:
    post:
      consumes:
      - application/json
      description: Returns a stable waiting snapshot in mock API mode; no queue entry
        is persisted.
      parameters:
      - description: External user identity
        in: header
        maxLength: 255
        name: X-User-ID
        required: true
        type: string
      - description: Product UUID
        format: uuid
        in: path
        name: productID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.QueueEntryResponse'
        "400":
          description: INVALID_PRODUCT_ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: UNAUTHORIZED or INVALID_USER_ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "501":
          description: Mock API disabled
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Join a product queue
      tags:
      - queue
  /api/v1/products/{productID}/queue-entry:
    delete:
      description: Returns a stable cancelled snapshot in mock API mode; no state
        is persisted.
      parameters:
      - description: External user identity
        in: header
        maxLength: 255
        name: X-User-ID
        required: true
        type: string
      - description: Product UUID
        format: uuid
        in: path
        name: productID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.QueueEntryResponse'
        "400":
          description: INVALID_PRODUCT_ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: UNAUTHORIZED or INVALID_USER_ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "501":
          description: Mock API disabled
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Leave the current product queue
      tags:
      - queue
    get:
      description: Returns the stable queue snapshot selected by GOODQUEUE_MOCK_QUEUE_STATUS.
      parameters:
      - description: External user identity
        in: header
        maxLength: 255
        name: X-User-ID
        required: true
        type: string
      - description: Product UUID
        format: uuid
        in: path
        name: productID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.QueueEntryResponse'
        "400":
          description: INVALID_PRODUCT_ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: UNAUTHORIZED or INVALID_USER_ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: PRODUCT_NOT_FOUND
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: INTERNAL_ERROR
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "501":
          description: Mock API disabled
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      summary: Get the current queue entry
      tags:
      - queue
  /healthz:
    get:
      description: Reports that the HTTP process is serving; does not check dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Liveness probe
      tags:
      - infrastructure
  /readyz:
    get:
      description: Reports whether PostgreSQL responds within the configured timeout.
        Dependency errors are never exposed.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Readiness probe
      tags:
      - infrastructure
produces:
- application/json
schemes:
- http
swagger: "2.0"
